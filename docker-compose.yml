# Local orchestration for the Cloud Log Access Service.
# Defaults run the backend with the mock storage provider — no cloud
# credentials required. Copy backend/.env.example to tune real providers.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-logaccess}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-logaccess}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    image: cloud-log-access-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/logaccess}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewer123}
      # AWS S3 (real account or the localstack profile below)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Use http://localstack:4566 with the aws-emulated profile (compose network),
      # or http://localhost:4566 when the backend runs directly on the host.
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      # GCP_BUCKET: ${GCP_BUCKET:-}
      # GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # AZURE_CONTAINER: ${AZURE_CONTAINER:-}
      # AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing API URL (calls come from the user's browser, not the container)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    image: cloud-log-access-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Optional: local AWS emulation so the real S3 provider code path
  # (ListObjectsV2, GetObject, pre-signed URLs) can be exercised without a
  # cloud account. Enable with: docker compose --profile aws-emulated up -d
  localstack:
    image: localstack/localstack:3.8
    profiles: ["aws-emulated"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata: